<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spare Parts Price & Catalogue</title>
<script src="data.js"></script>
<style>
  :root { --blue:#1F4E78; --light:#EEF4FA; --line:#D6DEE8; --muted:#6B7785; --ok:#2E7D32; --warn:#B26A00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; color:#1d2530; background:#F6F8FB; }
  header { background:var(--blue); color:#fff; padding:14px 20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  header h1 { font-size:20px; margin:0; font-weight:700; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  select, input[type=text] { font-size:15px; padding:8px 10px; border:1px solid #c9d3df; border-radius:6px; background:#fff; }
  input[type=text] { min-width:260px; }
  main { display:grid; grid-template-columns: 1fr 360px; gap:16px; padding:16px 20px; align-items:start; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px; }
  .meta { color:var(--muted); font-size:13px; margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:8px 8px; border-bottom:1px solid #edf1f6; text-align:left; vertical-align:middle; }
  th { background:var(--light); font-weight:700; color:#33465c; position:sticky; top:0; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  td.center, th.center { text-align:center; }
  .sec { color:var(--muted); font-size:12px; }
  .nopr { color:var(--warn); font-size:12px; }
  button { font-size:13px; padding:6px 10px; border-radius:6px; border:1px solid var(--blue); background:#fff; color:var(--blue); cursor:pointer; white-space:nowrap; }
  button:hover { background:var(--light); }
  button.primary { background:var(--blue); color:#fff; }
  button.primary:hover { background:#173b5c; }
  button.added { background:var(--ok); border-color:var(--ok); color:#fff; }
  button.danger { color:#B3261E; border-color:#B3261E; }
  .btns { display:flex; gap:6px; justify-content:flex-end; }
  .count { font-size:13px; color:var(--muted); margin:6px 0 0; }
  .cart-row { display:block; padding:9px 0; border-bottom:1px solid #edf1f6; }
  .cart-row .rm { margin-top:6px; }
  .cart-row .t { font-weight:700; font-size:14px; }
  .cart-row .s { color:var(--muted); font-size:12px; }
  .qty { display:flex; align-items:center; gap:6px; margin-top:4px; }
  .qty input { width:56px; text-align:center; font-size:14px; padding:4px; border:1px solid #c9d3df; border-radius:5px; }
  .totals { margin-top:12px; font-size:14px; }
  .totals div { display:flex; justify-content:space-between; padding:3px 0; }
  .totals .grand { font-weight:700; font-size:16px; border-top:1px solid var(--line); margin-top:4px; padding-top:6px; }
  .empty { color:var(--muted); font-size:14px; padding:12px 0; }
  .cart-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  /* modal */
  .modal { position:fixed; inset:0; background:rgba(10,20,35,.72); display:none; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal.open { display:flex; }
  .modal-box { background:#fff; border-radius:10px; max-width:1100px; width:100%; max-height:95vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal-head { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .modal-head .ttl { font-weight:700; }
  .modal-head .sub { font-size:12px; color:var(--muted); }
  .modal-body { overflow:auto; padding:10px; background:#f3f5f8; text-align:center; }
  .modal-body img { max-width:100%; height:auto; background:#fff; border:1px solid #dde3ea; }
  .modal-foot { padding:10px 16px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .hint { font-size:12px; color:var(--muted); }
  .badge { display:inline-block; background:var(--light); color:var(--blue); border-radius:10px; padding:1px 8px; font-size:11px; margin-left:6px; }
</style>
</head>
<body>

<header>
  <h1>Spare Parts Price &amp; Catalogue</h1>
  <div class="controls">
    <select id="model" aria-label="Select model"></select>
    <input type="text" id="search" placeholder="Search part no or name…" autocomplete="off">
  </div>
</header>

<main>
  <section class="card">
    <p class="meta" id="modelMeta"></p>
    <div style="overflow:auto; max-height:70vh;">
      <table>
        <thead>
          <tr>
            <th>Part No</th>
            <th>Part Name</th>
            <th class="center">Qty / vehicle</th>
            <th class="num">Dealer Price</th>
            <th class="num">Retail Price</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="count" id="count"></p>
  </section>

  <aside class="card">
    <h3 style="margin:0 0 6px; font-size:16px;">Quote / Order list</h3>
    <p class="meta">Items you add appear here. Totals are per item quantity.</p>
    <div id="cart"></div>
    <div class="totals" id="totals"></div>
    <div class="cart-actions">
      <button class="primary" id="exportBtn">Export CSV</button>
      <button class="danger" id="clearBtn">Clear all</button>
    </div>
  </aside>
</main>

<div class="modal" id="picModal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <div class="ttl" id="picTitle"></div>
        <div class="sub" id="picSub"></div>
      </div>
      <button id="picClose">Close ✕</button>
    </div>
    <div class="modal-body"><img id="picImg" alt="Catalogue pictorial"></div>
    <div class="modal-foot">
      <button id="picPrev">‹ Previous</button>
      <span class="hint" id="picPage"></span>
      <button id="picNext">Next ›</button>
    </div>
  </div>
</div>

<script>
(function () {
  const DATA = window.PARTS_DATA;
  const MODELS = DATA.models;
  const PRICES = DATA.prices;
  const LIMIT = 300;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = (n) => Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // ---------- pricing: match by part no, using the model's Div (2w / 3w) ----------
  function priceFor(model, part) {
    const list = PRICES[part];
    if (!list || !list.length) return null;
    let e = list.find(x => x.div === model.div) || list.find(x => !x.div);
    return e || null;
  }

  // ---------- state ----------
  let modelIdx = 0;
  let query = "";
  let cart = loadCart();
  let pic = { parts: [], idx: 0 };

  function loadCart() {
    try { return JSON.parse(localStorage.getItem("partsCart") || "[]"); } catch (e) { return []; }
  }
  function saveCart() {
    try { localStorage.setItem("partsCart", JSON.stringify(cart)); } catch (e) {}
  }

  // ---------- init model dropdown ----------
  const sel = $("model");
  MODELS.forEach((m, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = m.label + "  (" + m.parts.length + " parts)";
    sel.appendChild(o);
  });
  sel.addEventListener("change", () => { modelIdx = +sel.value; render(); });
  $("search").addEventListener("input", (e) => { query = e.target.value.trim().toLowerCase(); render(); });

  // ---------- results table ----------
  function render() {
    const model = MODELS[modelIdx];
    $("modelMeta").innerHTML = "Catalogue: <b>" + esc(model.label) + "</b> · Price list category: <b>" + esc(model.div === "2w" ? "2-wheeler" : "3-wheeler") + "</b>";
    let list = model.parts;
    if (query) {
      list = list.filter(e => e.p.toLowerCase().includes(query) || e.n.toLowerCase().includes(query));
    }
    const total = list.length;
    const shown = list.slice(0, LIMIT);
    const rows = shown.map(e => {
      const pr = priceFor(model, e.p);
      const name = (pr && pr.name) ? pr.name : e.n;
      let dlr, ret;
      if (!pr) { dlr = ret = '<span class="nopr">Not in price list</span>'; }
      else if (!pr.ret && !pr.dlr) { dlr = ret = '<span class="nopr">Not priced</span>'; }
      else { dlr = fmt(pr.dlr); ret = fmt(pr.ret); }
      const inCart = cart.find(c => c.key === model.id + "|" + e.p);
      const addLabel = inCart ? "Added (" + inCart.qty + ")" : "Add";
      return `<tr>
        <td><b>${esc(e.p)}</b></td>
        <td>${esc(name)}<div class="sec">${esc(e.s.join(" · "))}</div></td>
        <td class="center">${e.q}</td>
        <td class="num">${dlr}</td>
        <td class="num">${ret}</td>
        <td><div class="btns">
          <button data-pic="${esc(e.p)}">Pictorial</button>
          <button class="${inCart ? "added" : "primary"}" data-add="${esc(e.p)}">${addLabel}</button>
        </div></td>
      </tr>`;
    }).join("");
    $("rows").innerHTML = rows || '<tr><td colspan="6" class="empty">No parts match your search.</td></tr>';
    $("count").textContent = total === 0 ? "" :
      (total > LIMIT ? "Showing first " + LIMIT + " of " + total + " matches. Refine your search to narrow down." : total + " part(s)");
    renderCart();
  }

  // ---------- add / pictorial ----------
  $("rows").addEventListener("click", (ev) => {
    const addBtn = ev.target.closest("[data-add]");
    const picBtn = ev.target.closest("[data-pic]");
    if (addBtn) addToCart(addBtn.getAttribute("data-add"));
    if (picBtn) openPic(picBtn.getAttribute("data-pic"));
  });

  function addToCart(part) {
    const model = MODELS[modelIdx];
    const key = model.id + "|" + part;
    const existing = cart.find(c => c.key === key);
    if (existing) existing.qty += 1;
    else {
      const e = model.parts.find(x => x.p === part);
      const pr = priceFor(model, part);
      cart.push({ key, model: model.label, modelId: model.id, part, name: (pr && pr.name) || e.n,
                  dlr: pr ? pr.dlr : 0, ret: pr ? pr.ret : 0, priced: !!pr && (!!pr.dlr || !!pr.ret), qty: 1 });
    }
    saveCart(); render();
  }

  function renderCart() {
    const box = $("cart");
    if (!cart.length) {
      box.innerHTML = '<div class="empty">No items yet. Use <b>Add</b> on any part.</div>';
      $("totals").innerHTML = "";
      return;
    }
    box.innerHTML = cart.map((c, i) => `
      <div class="cart-row">
        <div>
          <div class="t">${esc(c.part)}</div>
          <div class="s">${esc(c.name)}</div>
          <div class="s">${esc(c.model)} · Retail ${c.priced ? fmt(c.ret) : "n/a"} · Dealer ${c.priced ? fmt(c.dlr) : "n/a"}</div>
          <div class="qty">
            <button data-dec="${i}">−</button>
            <input type="text" value="${c.qty}" data-qty="${i}" inputmode="numeric">
            <button data-inc="${i}">+</button>
          </div>
        </div>
        <div class="rm"><button class="danger" data-del="${i}">Remove</button></div>
      </div>`).join("");
    let dsum = 0, rsum = 0, unpriced = 0;
    cart.forEach(c => { if (c.priced) { dsum += c.dlr * c.qty; rsum += c.ret * c.qty; } else unpriced++; });
    $("totals").innerHTML = `
      <div><span>Dealer total</span><span>${fmt(dsum)}</span></div>
      <div class="grand"><span>Retail total</span><span>${fmt(rsum)}</span></div>
      ${unpriced ? `<div class="hint">${unpriced} item(s) without a price are excluded from totals.</div>` : ""}`;
  }

  $("cart").addEventListener("click", (ev) => {
    const t = ev.target;
    const idx = t.getAttribute("data-inc") ?? t.getAttribute("data-dec") ?? t.getAttribute("data-del");
    if (idx === null) return;
    const i = +idx;
    if (t.hasAttribute("data-inc")) cart[i].qty += 1;
    else if (t.hasAttribute("data-dec")) { cart[i].qty = Math.max(1, cart[i].qty - 1); }
    else if (t.hasAttribute("data-del")) cart.splice(i, 1);
    saveCart(); render();
  });
  $("cart").addEventListener("change", (ev) => {
    const i = ev.target.getAttribute("data-qty");
    if (i === null) return;
    const v = parseInt(ev.target.value, 10);
    if (v > 0) cart[+i].qty = v; else ev.target.value = cart[+i].qty;
    saveCart(); render();
  });

  $("clearBtn").addEventListener("click", () => {
    if (cart.length && confirm("Clear all items from the list?")) { cart = []; saveCart(); render(); }
  });

  $("exportBtn").addEventListener("click", () => {
    if (!cart.length) { alert("The list is empty."); return; }
    const head = ["Model","Part No","Part Name","Qty","Dealer Price","Retail Price","Dealer Total","Retail Total"];
    const lines = [head.join(",")];
    let d = 0, r = 0;
    cart.forEach(c => {
      const dt = c.priced ? c.dlr * c.qty : 0, rt = c.priced ? c.ret * c.qty : 0;
      d += dt; r += rt;
      lines.push([c.model, c.part, c.name, c.qty, c.priced ? c.dlr : "", c.priced ? c.ret : "", dt.toFixed(2), rt.toFixed(2)]
        .map(v => '"' + String(v).replace(/"/g, '""') + '"').join(","));
    });
    lines.push(["","","TOTAL","","","", d.toFixed(2), r.toFixed(2)].map(v => '"' + v + '"').join(","));
    const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "parts_quote.csv";
    document.body.appendChild(a); a.click(); a.remove();
  });

  // ---------- pictorial viewer ----------
  function openPic(part) {
    const model = MODELS[modelIdx];
    const e = model.parts.find(x => x.p === part);
    if (!e) return;
    pic = { parts: e.pg, idx: 0, model, part, sections: e.s };
    showPic();
    $("picModal").classList.add("open");
  }
  function showPic() {
    const page = pic.parts[pic.idx];
    $("picTitle").textContent = pic.part + " — " + pic.model.label;
    $("picSub").textContent = "Catalogue section: " + pic.sections.join(" · ");
    $("picImg").src = "images/" + pic.model.img + "/p" + page + ".jpg";
    $("picImg").alt = "Catalogue page " + page + " for " + pic.part;
    $("picPage").textContent = "Catalogue page " + page + " (" + (pic.idx + 1) + " of " + pic.parts.length + ")";
    $("picPrev").disabled = pic.idx === 0;
    $("picNext").disabled = pic.idx >= pic.parts.length - 1;
  }
  $("picPrev").addEventListener("click", () => { if (pic.idx > 0) { pic.idx--; showPic(); } });
  $("picNext").addEventListener("click", () => { if (pic.idx < pic.parts.length - 1) { pic.idx++; showPic(); } });
  $("picClose").addEventListener("click", () => $("picModal").classList.remove("open"));
  $("picModal").addEventListener("click", (ev) => { if (ev.target.id === "picModal") $("picModal").classList.remove("open"); });
  document.addEventListener("keydown", (ev) => {
    if (!$("picModal").classList.contains("open")) return;
    if (ev.key === "Escape") $("picModal").classList.remove("open");
    if (ev.key === "ArrowLeft") $("picPrev").click();
    if (ev.key === "ArrowRight") $("picNext").click();
  });

  render();
})();
</script>
</body>
</html>
